schema_version: 1

context:
  name: maxvolpy
  version: "0.3.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/maxvolpy-${{ version }}.tar.gz
  sha256: df4adb1bbc091e960ec5f3e5b53c3909ae428f5e48cf7ab95a01ea982a1a1980
  patches:
    - setup.patch

build:
  number: 4
  skip: win
  script: cd maxvolpy; ${{ PYTHON }} _maxvol.pyx.src; cd ..; ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - cython
    - numpy
    - pip
    - setuptools
    - libblas
    - liblapack
  run:
    - python
    - scipy
    - cython >=0.23.4
    - ${{ pin_compatible('numpy') }}

tests:
  - python:
      imports:
        - maxvolpy
      pip_check: true

about:
  summary: Cross and skeleton approximations, based on maximum volume submatrices.
  license: MIT
  license_file: LICENSE.txt
  homepage: https://bitbucket.org/muxas/maxvolpy
  documentation: https://pythonhosted.org/maxvolpy/

extra:
  recipe-maintainers:
    - jan-janssen
